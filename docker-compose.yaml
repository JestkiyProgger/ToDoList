services:
  todolist:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todolist/Dockerfile
    container_name: todolist
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=todolist-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/_out/logs
    volumes:
      - ${PROJECT_ROOT}/_out/logs:/app/_out/logs
    ports:
      - "5050:5050"
    restart: always

  todolist-postgres:
    image: postgres:18.4-bookworm
    container_name: todolist-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/_out/pgdata:/var/lib/postgresql
    restart: always

  todolist-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.1
    container_name: todolist-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todolist-postgres:5432
    ports:
      - "127.0.0.1:5433:5432"