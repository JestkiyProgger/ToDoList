host: 127.0.0.1:5050
info:
  contact: {}
  description: Todo application REST-API scheme
  title: Golang Todo API
  version: "1.0"
paths:
  /statistics:
    get:
      description: 'Получение: Количества созданных задач, количество сделанных задач,
        процент выполненных задач, среднее время выполнения задачи'
      parameters:
      - description: Размер списка задач
        in: query
        name: from
        type: string
      - description: Отступ от начала списка задач
        in: query
        name: to
        type: string
      - description: Статистика по определенного пользователя
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученная статистика
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Получение статистики
      tags:
      - statistics
  /tasks:
    get:
      description: Получить список задач с опциональной пагинацией и/или фильтрацией
        по id пользователя
      parameters:
      - description: Размер списка задач
        in: query
        name: limit
        type: integer
      - description: Отступ от начала списка задач
        in: query
        name: offset
        type: integer
      - description: Список задач определенного пользователя
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученный пользователь
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Получить задачи
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Создать новую задачу с конкретным пользователем
      parameters:
      - description: CreateTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданная задача
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удалить задачу в системе по ее ID
      parameters:
      - description: id удаляемой задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешно удаленная задача
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Удалить задачу
      tags:
      - tasks
    get:
      description: Получить конкретную задачу по ее ID
      parameters:
      - description: id получаемой задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученная задача
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Получить задачу
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Изменение конкретной задачи по ее id
        ### Логика обновления полей:
        1. **Поле не передано**: 'description' игнорируется, значение в БД не меняется
        2. **Явно передано значение**: '"description" : "Переделать на язык Java"' - устанавливает новое описание, значение в БД меняется
        3. **Передано значение null**: '"description" : null' - удаляет старое описание, значение в БД меняется
        Ограничение: 'title' и 'completed' не могут быть выставлены как "null"
      parameters:
      - description: id задачи
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно измененная задача
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Изменение задачи
      tags:
      - tasks
  /users:
    get:
      description: Получить список пользователей с опциональной пагинацией
      parameters:
      - description: Размер списка с пользователями
        in: query
