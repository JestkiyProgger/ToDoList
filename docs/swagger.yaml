    patch:
      consumes:
      - application/json
      description: |-
        Изменение конкретного пользователя по его id
        ### Логика обновления полей:
        1. **Поле не передано**: 'phone_number' игнорируется, значение в БД не меняется
        2. **Явно передано значение**: '"phone_number" : "+79879879876"' - устанавливает новый номер, значение в БД меняется
        3. **Передано значение null**: '"phone_number" : null' - удаляет старый номер, значение в БД меняется
