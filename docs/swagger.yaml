        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_JestkiyProgger_ToDoList_internal_core_transport_http_response.ErrorResponse'
      summary: Получить пользователя
      tags:
